[project]
name = "decoupled-ai-receptionist-template"
version = "1.0.0"
description = "Enterprise Multi-Agent Conversational AI Telephony Receptionist Webhook built with Google ADK and Gemini Live"
authors = [
    {name = "AI Solutions Architect", email = "support@example-retail.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=1.15.0,<2.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.29.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "google-auth>=2.29.0,<3.0.0",
    "google-api-python-client>=2.128.0,<3.0.0",
    "google-cloud-logging>=3.10.0,<4.0.0",
    "opentelemetry-api>=1.24.0,<2.0.0",
    "opentelemetry-sdk>=1.24.0,<2.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "protobuf>=5.26.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "ruff>=0.4.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "ruff>=0.4.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --tb=short"

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "*_audit.py",
    "app/agent_runtime_app.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff rules
]
ignore = ["E501", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
